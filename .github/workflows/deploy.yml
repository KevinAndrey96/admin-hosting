name: Deploy Admin Panel to cPanel

on:
  push:
    branches:
      - admin-hosting
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_SSH_KEY: ${{ secrets.CPANEL_SSH_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client & Build Next.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'mysql://user:password@127.0.0.1:3306/app' }}
          NEXT_PUBLIC_BASE_PATH: /admin
        run: npm run build

      # Deploy runs only on manual dispatch with an SSH key secret: the host uses
      # ephemeral audit keys and CloudLinux NPROC limits on account shape.
      - name: Skip deploy notice
        if: github.event_name != 'workflow_dispatch' || env.HAS_SSH_KEY != 'true'
        run: echo "Build OK. Deploy skipped (manual dispatch with CPANEL_SSH_KEY required)."

      - name: Create Clean Deploy ZIP
        if: github.event_name == 'workflow_dispatch' && env.HAS_SSH_KEY == 'true'
        run: |
          zip -r admin-deploy-prod.zip .htaccess package.json start-server.js next.config.js tsconfig.json prisma.config.ts .next/standalone app lib prisma types public -x "*.DS_Store" -x "node_modules/*" -x ".next/cache/*"

      - name: Transfer Deployment Package to cPanel
        if: github.event_name == 'workflow_dispatch' && env.HAS_SSH_KEY == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CPANEL_SSH_HOST || '46.224.80.244' }}
          username: ${{ secrets.CPANEL_SSH_USER || 'shape' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: 'admin-deploy-prod.zip'
          target: '/mnt/atlas/shape/admin'

      - name: Extract & Reload Passenger Application
        if: github.event_name == 'workflow_dispatch' && env.HAS_SSH_KEY == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_SSH_HOST || '46.224.80.244' }}
          username: ${{ secrets.CPANEL_SSH_USER || 'shape' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            cd /mnt/atlas/shape/admin
            unzip -o admin-deploy-prod.zip
            mkdir -p uploads/comprobantes
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment successfully executed and Passenger reloaded!"
