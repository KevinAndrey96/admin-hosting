name: Deploy Admin Panel to cPanel

on:
  push:
    branches:
      - admin-hosting
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma Client & Build Next.js
        run: npm run build

      - name: Create Clean Deploy ZIP
        run: |
          zip -r admin-deploy-prod.zip .htaccess package.json start-server.js next.config.js tsconfig.json .next/standalone app lib prisma types public -x "*.DS_Store" -x "node_modules/*" -x ".next/cache/*"

      - name: Transfer Deployment Package to cPanel
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.CPANEL_SSH_HOST || '46.224.80.244' }}
          username: ${{ secrets.CPANEL_SSH_USER || 'shape' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          source: 'admin-deploy-prod.zip'
          target: '/mnt/atlas/shape/admin'

      - name: Extract & Reload Passenger Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.CPANEL_SSH_HOST || '46.224.80.244' }}
          username: ${{ secrets.CPANEL_SSH_USER || 'shape' }}
          key: ${{ secrets.CPANEL_SSH_KEY }}
          port: ${{ secrets.CPANEL_SSH_PORT || 22 }}
          script: |
            cd /mnt/atlas/shape/admin
            unzip -o admin-deploy-prod.zip
            mkdir -p uploads/comprobantes
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deployment successfully executed and Passenger reloaded!"
